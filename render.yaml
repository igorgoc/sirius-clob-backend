services:
  - type: web
    name: sirius-clob-backend
    runtime: docker
    plan: free
    autoDeploy: true
    healthCheckPath: /api/clob/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SIRIUS_NETWORK
        value: testnet2
      - key: SIRIUS_NODE_URL
        value: https://api-2.testnet2.xpxsirius.io
