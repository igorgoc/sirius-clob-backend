[package]
name = "sirius-clob"
version = "0.1.0"
edition = "2021"
description = "High-Performance On-Chain Central Limit Order Book (CLOB) DEX for ProximaX Sirius SuperContract V2"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[dependencies]
xpx-sdk = { path = "../sdk" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3.3"

[dev-dependencies]
# Standard dev dependencies for cargo test on host

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
overflow-checks = true
